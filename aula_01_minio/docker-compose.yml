services:
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin_local}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-troque_por_uma_senha_gerada}

volumes:
  minio_data: